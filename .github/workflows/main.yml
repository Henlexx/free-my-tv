name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" || true
      - name: Config
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          printf '%s\n' "tmdb_key=$TMDB_KEY" "tmdb_region=CR" "latitude=9.9281" "longitude=-84.0907" "city=San José" "language=en" "currency=USD" "temperature=C" > config.properties
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV
          path: |
            FreeMyTV.apk
            freemytv.keystore
